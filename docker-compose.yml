services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - UV_THREADPOOL_SIZE=32
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app:Z
      - /app/node_modules
    depends_on:
      - postgres-db
      - redis-db
    #   - mongo-db
    networks:
      - kodevio_server_network
    profiles:
      - dev

  postgres-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kodevio_server_network
    profiles:
      - dev

  redis-db:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kodevio_server_network
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:

networks:
  kodevio_server_network:
    driver: bridge
    name: kodevio_server_network
